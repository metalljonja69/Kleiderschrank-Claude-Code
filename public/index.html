<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kleiderschrank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Chakra+Petch:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a0512;
    --bg2: #2b0a24;
    --bg3: #3a1030;
    --text: #fdeaf5;
    --text-muted: #b5849f;
    --linie: rgba(255, 214, 240, .18);
    --neon: #00f0ff;
    --neon2: #ff2a6d;
    --stange: #29e6d6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Chakra Petch', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    position: relative;
    padding-bottom: 76px; /* Platz fuer die untere Tab-Leiste */
    min-height: 100vh;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 240, 255, .035) 0px,
      rgba(0, 240, 255, .035) 1px,
      transparent 1px,
      transparent 3px
    );
  }

  h1, h2, h3 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 0;
  }

  .mono-label {
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .12em;
    font-size: 11px;
    color: var(--text-muted);
  }

  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* ---------- Kopfbereich ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--linie);
    padding: 20px 20px 16px;
  }

  header h1 {
    font-size: 26px;
    letter-spacing: .06em;
    color: var(--neon);
    text-shadow: 0 0 12px rgba(0, 240, 255, .55);
  }

  .kopf-reihe {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panther-icon {
    flex: none;
    width: 34px;
    height: auto;
    color: var(--neon2);
    filter: drop-shadow(0 0 6px rgba(255, 42, 109, .65));
  }

  main {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    padding: 20px;
  }

  .tab { display: none; }
  .tab.aktiv { display: block; }

  /* ---------- Untere Tab-Leiste ---------- */
  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: var(--bg2);
    border-top: 1px solid var(--linie);
    z-index: 20;
  }

  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 12px 4px 14px;
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .1em;
    font-size: 11px;
  }

  nav.tabs button.aktiv {
    color: var(--neon);
    box-shadow: inset 0 2px 0 var(--neon);
    text-shadow: 0 0 8px rgba(0, 240, 255, .7);
  }

  /* ---------- Filter-Chips ---------- */
  .chips {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    margin-bottom: 20px;
  }

  .chip {
    flex: none;
    background: var(--bg2);
    border: 1px solid var(--linie);
    color: var(--text-muted);
    border-radius: 2px;
    padding: 7px 14px;
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 11px;
    white-space: nowrap;
  }

  .chip.aktiv {
    color: var(--bg);
    background: var(--neon);
    border-color: var(--neon);
    box-shadow: 0 0 10px rgba(0, 240, 255, .55);
  }

  /* ---------- Teile-Grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 14px;
  }

  .karte {
    position: relative;
    background: var(--bg2);
    border: 1px solid var(--linie);
    border-radius: 2px;
    overflow: hidden;
    transition: box-shadow .15s ease, border-color .15s ease;
  }

  .karte:hover {
    border-color: var(--neon);
    box-shadow: 0 0 14px rgba(0, 240, 255, .25);
  }

  .kachel {
    width: 100%;
    aspect-ratio: 1 / 1;
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .karte .name {
    padding: 8px 10px 0;
    font-size: 14px;
  }

  .unterkat {
    padding: 2px 10px 10px;
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .08em;
    font-size: 9px;
    color: var(--neon);
    opacity: .75;
  }

  .picker-item .unterkat {
    padding: 0;
  }

  .loeschen-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 2px;
    border: 1px solid var(--linie);
    background: rgba(7, 9, 18, .75);
    color: var(--text);
    font-size: 14px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .15s ease, color .15s ease;
  }

  .loeschen-btn:hover {
    border-color: var(--neon2);
    color: var(--neon2);
  }

  .leer-hinweis {
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed;
    right: 20px;
    bottom: 92px;
    width: 52px;
    height: 52px;
    border-radius: 2px;
    background: var(--neon);
    color: var(--bg);
    border: none;
    font-size: 26px;
    z-index: 15;
    box-shadow: 0 0 18px rgba(0, 240, 255, .6), 0 4px 14px rgba(0, 0, 0, .5);
  }

  /* ---------- Outfit bauen: die Stange ---------- */
  .stangen-bereich {
    padding-top: 10px;
  }

  .schienen-scroll {
    overflow-x: auto;
    padding-bottom: 6px;
  }

  .schienen-inner {
    display: inline-flex;
    flex-direction: column;
    min-width: 100%;
    padding: 0 4px;
  }

  .stange {
    height: 3px;
    background: var(--stange);
    border-radius: 2px;
    margin: 0 6px 0;
    box-shadow: 0 0 10px rgba(41, 230, 214, .8);
  }

  .haken {
    flex: 0 0 76px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .kordel {
    width: 1px;
    height: 22px;
    background: var(--linie);
  }

  .schienen-reihe {
    display: flex;
    gap: 10px;
  }

  .slot {
    flex: 0 0 76px;
    min-width: 0;
    background: none;
    border: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .slot-kachel {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 2px;
    border: 1px dashed var(--linie);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 22px;
  }

  .slot.gefuellt .slot-kachel {
    border: 1px solid var(--neon);
    box-shadow: 0 0 10px rgba(0, 240, 255, .35);
  }

  .slot-label {
    font-family: 'Share Tech Mono', monospace;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
  }

  .outfit-formular {
    margin-top: 44px;
    border-top: 1px solid var(--linie);
    padding-top: 20px;
  }

  input[type="text"], select, input[type="color"] {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--linie);
    color: var(--text);
    border-radius: 2px;
    padding: 10px 12px;
    font-family: 'Chakra Petch', sans-serif;
    font-size: 15px;
  }

  input[type="text"]:focus, select:focus, input[type="color"]:focus {
    outline: none;
    border-color: var(--neon);
    box-shadow: 0 0 0 3px rgba(0, 240, 255, .18);
  }

  input[type="color"] {
    height: 42px;
    padding: 4px;
  }

  .feld {
    margin-bottom: 16px;
  }

  .feld label {
    display: block;
    margin-bottom: 6px;
  }

  .primaer-btn {
    width: 100%;
    background: var(--neon);
    color: var(--bg);
    border: none;
    border-radius: 2px;
    padding: 13px;
    font-family: 'Orbitron', sans-serif;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 0 16px rgba(0, 240, 255, .4);
  }

  .primaer-btn:disabled {
    background: var(--bg3);
    color: var(--text-muted);
    box-shadow: none;
  }

  .saison-liste {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .saison-liste label {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg2);
    border: 1px solid var(--linie);
    border-radius: 2px;
    padding: 7px 10px;
    font-size: 13px;
    margin: 0;
  }

  .fehler {
    color: var(--neon2);
    font-size: 13px;
    margin-top: 8px;
    min-height: 16px;
  }

  /* ---------- Outfit-Karten ---------- */
  .outfit-karte {
    background: var(--bg2);
    border: 1px solid var(--linie);
    border-radius: 2px;
    padding: 14px;
    margin-bottom: 14px;
  }

  .outfit-thumbs {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .outfit-thumbs .kachel {
    width: 52px;
    height: 52px;
    aspect-ratio: auto;
    border-radius: 2px;
    flex: none;
  }

  .outfit-kopf {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }

  .outfit-kopf h3 {
    font-size: 17px;
  }

  .outfit-datum {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .outfit-loeschen {
    background: none;
    border: 1px solid var(--linie);
    color: var(--text-muted);
    border-radius: 2px;
    padding: 6px 10px;
    font-size: 12px;
    transition: border-color .15s ease, color .15s ease;
  }

  .outfit-loeschen:hover {
    border-color: var(--neon2);
    color: var(--neon2);
  }

  /* ---------- Overlays / Modals ---------- */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(3, 4, 8, .75);
    z-index: 50;
    align-items: flex-end;
    justify-content: center;
  }

  .overlay.sichtbar {
    display: flex;
  }

  .overlay-inhalt {
    background: var(--bg2);
    border-top: 1px solid var(--neon);
    box-shadow: 0 -8px 30px rgba(0, 240, 255, .18);
    border-radius: 2px 2px 0 0;
    width: 100%;
    max-width: 720px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 22px 20px 28px;
  }

  .overlay-kopf {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .schliessen-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 22px;
    line-height: 1;
  }

  .foto-vorschau {
    width: 120px;
    height: 120px;
    border-radius: 2px;
    border: 1px dashed var(--linie);
    background-size: cover;
    background-position: center;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-bottom: 12px;
    text-align: center;
    padding: 6px;
  }

  .picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
  }

  .picker-item {
    background: var(--bg3);
    border: 1px solid var(--linie);
    border-radius: 2px;
    padding: 6px;
    color: var(--text);
    text-align: center;
  }

  .picker-item .kachel {
    border-radius: 2px;
    margin-bottom: 6px;
  }

  .picker-item .pname {
    font-size: 12px;
  }

  .picker-leeren {
    width: 100%;
    background: none;
    border: 1px solid var(--linie);
    color: var(--text-muted);
    border-radius: 2px;
    padding: 10px;
    margin-bottom: 14px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="kopf-reihe">
    <h1>Kleiderschrank</h1>
    <svg class="panther-icon" viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M78 40 C95 35, 95 10, 78 8 C90 12, 88 30, 74 34 Z" fill="currentColor"/>
      <ellipse cx="45" cy="45" rx="30" ry="18" fill="currentColor"/>
      <circle cx="20" cy="30" r="14" fill="currentColor"/>
      <path d="M10 20 L14 6 L20 18 Z" fill="currentColor"/>
      <path d="M24 18 L30 6 L32 20 Z" fill="currentColor"/>
      <rect x="25" y="55" width="6" height="14" rx="3" fill="currentColor"/>
      <rect x="45" y="58" width="6" height="12" rx="3" fill="currentColor"/>
      <rect x="60" y="55" width="6" height="14" rx="3" fill="currentColor"/>
    </svg>
  </div>
</header>

<main>

  <!-- ================= TAB: SCHRANK ================= -->
  <section id="tab-schrank" class="tab aktiv">
    <div class="chips" id="filter-chips"></div>
    <div class="grid" id="teile-grid"></div>
  </section>

  <!-- ================= TAB: OUTFIT BAUEN ================= -->
  <section id="tab-bauen" class="tab">
    <div class="stangen-bereich">
      <div class="schienen-scroll">
      <div class="schienen-inner">
      <div class="stange"></div>
      <div class="schienen-reihe" id="kordel-reihe">
        <!-- Kordeln werden per JS erzeugt -->
      </div>
      <div class="schienen-reihe" id="slot-reihe">
        <!-- Slots werden per JS erzeugt -->
      </div>
      </div>
      </div>
    </div>

    <div class="outfit-formular">
      <div class="feld">
        <label class="mono-label" for="outfit-name">Name des Outfits</label>
        <input type="text" id="outfit-name" placeholder="z. B. Regentag Buero">
      </div>
      <button class="primaer-btn" id="outfit-speichern-btn" disabled>Outfit speichern</button>
      <div class="fehler" id="outfit-fehler"></div>
    </div>
  </section>

  <!-- ================= TAB: OUTFITS ================= -->
  <section id="tab-outfits" class="tab">
    <div id="outfits-liste"></div>
  </section>

</main>

<button class="fab" id="fab-neu" title="Neues Teil">+</button>

<nav class="tabs">
  <button class="aktiv" data-tab="schrank">Schrank</button>
  <button data-tab="bauen">Outfit bauen</button>
  <button data-tab="outfits">Outfits</button>
</nav>

<!-- ============ Overlay: Neues Teil ============ -->
<div class="overlay" id="overlay-teil">
  <div class="overlay-inhalt">
    <div class="overlay-kopf">
      <h2>Neues Teil</h2>
      <button class="schliessen-btn" id="teil-schliessen">&times;</button>
    </div>

    <form id="teil-formular">
      <div class="feld">
        <label class="mono-label">Foto</label>
        <div class="foto-vorschau" id="foto-vorschau">Kein Foto</div>
        <input type="file" accept="image/*" id="foto-input">
      </div>

      <div class="feld">
        <label class="mono-label" for="teil-name">Name</label>
        <input type="text" id="teil-name" placeholder="z. B. Blauer Rollkragenpulli">
      </div>

      <div class="feld">
        <label class="mono-label" for="teil-kategorie">Kategorie</label>
        <select id="teil-kategorie">
          <option value="kopfbedeckung">Kopfbedeckung</option>
          <option value="oberteil">Oberteil</option>
          <option value="hose">Hose</option>
          <option value="socken">Socken</option>
          <option value="schuhe">Schuhe</option>
          <option value="accessoire">Accessoires</option>
        </select>
      </div>

      <div class="feld" id="unterkategorie-feld" style="display:none;">
        <label class="mono-label" for="teil-unterkategorie">Untergruppe</label>
        <select id="teil-unterkategorie"></select>
      </div>

      <div class="feld">
        <label class="mono-label" for="teil-farbe">Farbe</label>
        <input type="color" id="teil-farbe" value="#98A1AE">
      </div>

      <div class="feld">
        <label class="mono-label">Saison</label>
        <div class="saison-liste" id="saison-liste"></div>
      </div>

      <button type="submit" class="primaer-btn">Speichern</button>
      <div class="fehler" id="teil-fehler"></div>
    </form>
  </div>
</div>

<!-- ============ Overlay: Teil fuer Slot waehlen ============ -->
<div class="overlay" id="overlay-picker">
  <div class="overlay-inhalt">
    <div class="overlay-kopf">
      <h2 id="picker-titel">Teil waehlen</h2>
      <button class="schliessen-btn" id="picker-schliessen">&times;</button>
    </div>
    <button class="picker-leeren" id="picker-leeren">Slot leeren</button>
    <div class="picker-grid" id="picker-grid"></div>
  </div>
</div>

<script>
  const KATEGORIEN = ["kopfbedeckung", "oberteil", "hose", "socken", "schuhe", "accessoire"];
  const KATEGORIE_LABEL = {
    kopfbedeckung: "Kopfbedeckung",
    oberteil: "Oberteil",
    hose: "Hose",
    socken: "Socken",
    schuhe: "Schuhe",
    accessoire: "Accessoires",
  };
  const SAISONEN = ["Frühling", "Sommer", "Herbst", "Winter"];
  const UNTERKATEGORIEN = {
    oberteil: ["Jacke", "Pulli", "T-Shirt"],
    hose: ["Lang", "Kurz"],
  };

  let teile = [];
  let outfits = [];
  let filterAktiv = "alle";
  let outfitAuswahl = {}; // { kategorie: teilId }
  let aktuellerSlot = null;
  let fotoDataUrl = null;

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text == null ? "" : text;
    return div.innerHTML;
  }

  function teilNachId(id) {
    return teile.find((t) => t.id === id);
  }

  function kachelStil(teil) {
    if (teil && teil.foto) {
      return `background-image: url('/fotos/${encodeURIComponent(teil.foto)}')`;
    }
    return `background-color: ${teil ? escapeHtml(teil.farbe) : "#333"}`;
  }

  // ---------------- Laden ----------------

  async function ladeAlles() {
    const res = await fetch("/api/alles");
    const data = await res.json();
    teile = data.teile;
    outfits = data.outfits;
    renderChips();
    renderGrid();
    renderRail();
    renderOutfits();
  }

  // ---------------- Tabs ----------------

  document.querySelectorAll("nav.tabs button").forEach((btn) => {
    btn.addEventListener("click", () => wechsleTab(btn.dataset.tab));
  });

  function wechsleTab(name) {
    document.querySelectorAll(".tab").forEach((el) => el.classList.remove("aktiv"));
    document.getElementById(`tab-${name}`).classList.add("aktiv");
    document.querySelectorAll("nav.tabs button").forEach((btn) => {
      btn.classList.toggle("aktiv", btn.dataset.tab === name);
    });
    document.getElementById("fab-neu").style.display = name === "schrank" ? "flex" : "none";
  }

  // ---------------- Tab: Schrank ----------------

  function renderChips() {
    const container = document.getElementById("filter-chips");
    const chips = [{ id: "alle", label: "Alle" }, ...KATEGORIEN.map((k) => ({ id: k, label: KATEGORIE_LABEL[k] }))];
    container.innerHTML = chips
      .map(
        (c) => `<button class="chip ${c.id === filterAktiv ? "aktiv" : ""}" data-kat="${c.id}">${c.label}</button>`
      )
      .join("");
    container.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        filterAktiv = btn.dataset.kat;
        renderChips();
        renderGrid();
      });
    });
  }

  function renderGrid() {
    const grid = document.getElementById("teile-grid");
    const liste = filterAktiv === "alle" ? teile : teile.filter((t) => t.kategorie === filterAktiv);

    if (liste.length === 0) {
      grid.innerHTML = `<div class="leer-hinweis">Noch keine Teile hier. Tipp unten rechts auf "+".</div>`;
      return;
    }

    grid.innerHTML = liste
      .map(
        (t) => `
        <div class="karte" data-id="${t.id}">
          <div class="kachel" style="${kachelStil(t)}"></div>
          <div class="name">${escapeHtml(t.name)}</div>
          ${t.unterkategorie ? `<div class="unterkat">${escapeHtml(t.unterkategorie)}</div>` : ""}
          <button class="loeschen-btn" data-loeschen="${t.id}">&times;</button>
        </div>`
      )
      .join("");

    grid.querySelectorAll("[data-loeschen]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        teilLoeschen(btn.dataset.loeschen);
      });
    });
  }

  async function teilLoeschen(id) {
    if (!confirm("Dieses Teil wirklich loeschen?")) return;
    await fetch(`/api/teile/${id}`, { method: "DELETE" });
    await ladeAlles();
  }

  // ---------------- Overlay: Neues Teil ----------------

  const overlayTeil = document.getElementById("overlay-teil");

  document.getElementById("fab-neu").addEventListener("click", () => {
    document.getElementById("teil-formular").reset();
    document.getElementById("teil-farbe").value = "#98A1AE";
    fotoDataUrl = null;
    document.getElementById("foto-vorschau").style.backgroundImage = "";
    document.getElementById("foto-vorschau").textContent = "Kein Foto";
    document.getElementById("teil-fehler").textContent = "";
    renderSaisonListe();
    aktualisiereUnterkategorie();
    overlayTeil.classList.add("sichtbar");
  });

  document.getElementById("teil-schliessen").addEventListener("click", () => {
    overlayTeil.classList.remove("sichtbar");
  });

  function aktualisiereUnterkategorie() {
    const kategorie = document.getElementById("teil-kategorie").value;
    const feld = document.getElementById("unterkategorie-feld");
    const select = document.getElementById("teil-unterkategorie");
    const optionen = UNTERKATEGORIEN[kategorie];

    if (optionen) {
      select.innerHTML =
        `<option value="">– keine Angabe –</option>` +
        optionen.map((o) => `<option value="${o}">${o}</option>`).join("");
      feld.style.display = "";
    } else {
      select.innerHTML = "";
      feld.style.display = "none";
    }
  }

  document.getElementById("teil-kategorie").addEventListener("change", aktualisiereUnterkategorie);

  function renderSaisonListe() {
    const el = document.getElementById("saison-liste");
    el.innerHTML = SAISONEN.map(
      (s) => `<label><input type="checkbox" value="${s}"> ${s}</label>`
    ).join("");
  }

  document.getElementById("foto-input").addEventListener("change", async (e) => {
    const datei = e.target.files[0];
    if (!datei) return;
    fotoDataUrl = await bildVerkleinern(datei);
    document.getElementById("foto-vorschau").style.backgroundImage = `url('${fotoDataUrl}')`;
    document.getElementById("foto-vorschau").textContent = "";
  });

  function bildVerkleinern(datei) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxGroesse = 800;
          let { width, height } = img;
          if (width > maxGroesse || height > maxGroesse) {
            if (width >= height) {
              height = Math.round(height * (maxGroesse / width));
              width = maxGroesse;
            } else {
              width = Math.round(width * (maxGroesse / height));
              height = maxGroesse;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", 0.78));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(datei);
    });
  }

  document.getElementById("teil-formular").addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("teil-name").value.trim();
    const kategorie = document.getElementById("teil-kategorie").value;
    const unterkategorie = document.getElementById("teil-unterkategorie").value || null;
    const farbe = document.getElementById("teil-farbe").value;
    const saison = Array.from(document.querySelectorAll("#saison-liste input:checked")).map((c) => c.value);
    const fehlerEl = document.getElementById("teil-fehler");

    if (!name || !kategorie) {
      fehlerEl.textContent = "Name und Kategorie sind Pflicht.";
      return;
    }

    const res = await fetch("/api/teile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, kategorie, unterkategorie, farbe, saison, foto: fotoDataUrl }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      fehlerEl.textContent = data.fehler || "Da ist etwas schiefgelaufen.";
      return;
    }

    overlayTeil.classList.remove("sichtbar");
    await ladeAlles();
  });

  // ---------------- Tab: Outfit bauen ----------------

  // Fuer Kategorien mit Untergruppen gibt es einen eigenen Slot pro Untergruppe
  // (z.B. Oberteil::T-Shirt und Oberteil::Pulli getrennt), damit man beides
  // gleichzeitig anziehen kann. Kategorien ohne Untergruppen bekommen einen Slot.
  function baueSlots() {
    const slots = [];
    KATEGORIEN.forEach((k) => {
      const unterkats = UNTERKATEGORIEN[k];
      if (unterkats) {
        unterkats.forEach((u) => slots.push({ id: `${k}::${u}`, kategorie: k, unterkategorie: u, label: u }));
      } else {
        slots.push({ id: k, kategorie: k, unterkategorie: null, label: KATEGORIE_LABEL[k] });
      }
    });
    return slots;
  }

  function renderRail() {
    const slots = baueSlots();
    const kordelReihe = document.getElementById("kordel-reihe");
    const slotReihe = document.getElementById("slot-reihe");

    kordelReihe.innerHTML = slots.map(() => `<div class="haken"><div class="kordel"></div></div>`).join("");

    slotReihe.innerHTML = slots
      .map((s) => {
        const teilId = outfitAuswahl[s.id];
        const teil = teilId ? teilNachId(teilId) : null;
        return `
        <button class="slot ${teil ? "gefuellt" : ""}" data-slot="${s.id}">
          <div class="slot-kachel" style="${teil ? kachelStil(teil) : ""}">${teil ? "" : "+"}</div>
          <div class="slot-label">${escapeHtml(s.label)}</div>
        </button>`;
      })
      .join("");

    slotReihe.querySelectorAll(".slot").forEach((btn) => {
      btn.addEventListener("click", () => offnePicker(btn.dataset.slot));
    });

    aktualisiereSpeichernButton();
  }

  function offnePicker(slotId) {
    aktuellerSlot = slotId;
    const slot = baueSlots().find((s) => s.id === slotId);
    document.getElementById("picker-titel").textContent = `${slot.label} waehlen`;

    const auswahl = teile.filter(
      (t) => t.kategorie === slot.kategorie && (!slot.unterkategorie || t.unterkategorie === slot.unterkategorie)
    );
    const grid = document.getElementById("picker-grid");

    if (auswahl.length === 0) {
      grid.innerHTML = `<div class="leer-hinweis">Noch keine Teile in dieser Kategorie.</div>`;
    } else {
      grid.innerHTML = auswahl
        .map(
          (t) => `
          <button class="picker-item" data-id="${t.id}">
            <div class="kachel" style="aspect-ratio:1/1; ${kachelStil(t)}"></div>
            <div class="pname">${escapeHtml(t.name)}</div>
            ${t.unterkategorie ? `<div class="unterkat">${escapeHtml(t.unterkategorie)}</div>` : ""}
          </button>`
        )
        .join("");
    }

    grid.querySelectorAll(".picker-item").forEach((btn) => {
      btn.addEventListener("click", () => {
        outfitAuswahl[slotId] = btn.dataset.id;
        schliessePicker();
        renderRail();
      });
    });

    document.getElementById("overlay-picker").classList.add("sichtbar");
  }

  function schliessePicker() {
    document.getElementById("overlay-picker").classList.remove("sichtbar");
  }

  document.getElementById("picker-schliessen").addEventListener("click", schliessePicker);

  document.getElementById("picker-leeren").addEventListener("click", () => {
    if (aktuellerSlot) delete outfitAuswahl[aktuellerSlot];
    schliessePicker();
    renderRail();
  });

  function aktualisiereSpeichernButton() {
    const anzahl = Object.keys(outfitAuswahl).length;
    const name = document.getElementById("outfit-name").value.trim();
    document.getElementById("outfit-speichern-btn").disabled = !(anzahl >= 2 && name.length > 0);
  }

  document.getElementById("outfit-name").addEventListener("input", aktualisiereSpeichernButton);

  document.getElementById("outfit-speichern-btn").addEventListener("click", async () => {
    const name = document.getElementById("outfit-name").value.trim();
    const fehlerEl = document.getElementById("outfit-fehler");

    const res = await fetch("/api/outfits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, teile: outfitAuswahl }),
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      fehlerEl.textContent = data.fehler || "Da ist etwas schiefgelaufen.";
      return;
    }

    fehlerEl.textContent = "";
    outfitAuswahl = {};
    document.getElementById("outfit-name").value = "";
    renderRail();
    await ladeAlles();
    wechsleTab("outfits");
  });

  // ---------------- Tab: Outfits ----------------

  function renderOutfits() {
    const el = document.getElementById("outfits-liste");

    if (outfits.length === 0) {
      el.innerHTML = `<div class="leer-hinweis">Noch keine Outfits gespeichert.</div>`;
      return;
    }

    el.innerHTML = outfits
      .map((o) => {
        const teilIds = Object.values(o.teile);
        const thumbs = teilIds
          .map((id) => {
            const t = teilNachId(id);
            return `<div class="kachel" style="${t ? kachelStil(t) : "background-color:#333"}"></div>`;
          })
          .join("");

        const datum = new Date(o.erstellt).toLocaleDateString("de-DE", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
        });

        return `
          <div class="outfit-karte" data-id="${o.id}">
            <div class="outfit-thumbs">${thumbs}</div>
            <div class="outfit-kopf">
              <div>
                <h3>${escapeHtml(o.name)}</h3>
                <div class="outfit-datum">${datum}</div>
              </div>
              <button class="outfit-loeschen" data-loeschen="${o.id}">Loeschen</button>
            </div>
          </div>`;
      })
      .join("");

    el.querySelectorAll("[data-loeschen]").forEach((btn) => {
      btn.addEventListener("click", () => outfitLoeschen(btn.dataset.loeschen));
    });
  }

  async function outfitLoeschen(id) {
    if (!confirm("Dieses Outfit wirklich loeschen?")) return;
    await fetch(`/api/outfits/${id}`, { method: "DELETE" });
    await ladeAlles();
  }

  // ---------------- Start ----------------

  ladeAlles();
</script>

</body>
</html>
